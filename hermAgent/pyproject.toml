[project]
name = "hermagent"
version = "0.1.0"
description = "Reproducible Hermes Agent setup (OpenRouter default, optional Ollama) for Linux and macOS"
requires-python = ">=3.12,<3.13"
dependencies = [
    "hermes-agent==0.19.0",
    "httpx",
    "psutil",
    "python-dotenv",
    "pyyaml",
]

[project.scripts]
hagent = "hermagent.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls a real model backend (needs OPENROUTER_API_KEY or a running Ollama)"]
addopts = "-m 'not live'"
